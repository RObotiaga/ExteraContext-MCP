name: MCP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pinned Knowledge database
        run: python scripts/sync_knowledge.py
      - name: Python regression suite
        run: |
          python tests/smoke.py
          python tests/test_skill_contract.py
          python tests/test_knowledge_writeback.py
          python tests/test_orchestrator.py
      - name: Install MCP SDK
        working-directory: mcp
        run: npm install --no-audit --no-fund
      - name: MCP contract and wire tests
        working-directory: mcp
        run: |
          npm run check
          npm test
