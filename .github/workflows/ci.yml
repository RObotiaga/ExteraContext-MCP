name: MCP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pinned Knowledge database
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/sync_knowledge.py > sync.log 2>&1 || echo $? > sync.exit
          cat sync.log
      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diagnostics
          path: sync.log
      - name: Fail if Knowledge sync failed
        if: steps.sync.outcome == 'failure' || hashFiles('sync.exit') != ''
        run: exit 1
      - name: Python regression suite
        run: |
          python tests/smoke.py
          python tests/test_skill_contract.py
          python tests/test_knowledge_writeback.py
          python tests/test_orchestrator.py
      - name: Install MCP SDK
        working-directory: mcp
        run: npm install --no-audit --no-fund
      - name: MCP contract and wire tests
        working-directory: mcp
        run: |
          npm run check
          npm test
