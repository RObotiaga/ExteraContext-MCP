name: MCP CI (offline knowledge)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # Never collect/clone/sync the external corpus as part of ordinary CI.
    # Corpus-dependent smoke, bridge and wire tests require a separately approved,
    # locally provided corpus DB and are intentionally excluded here.
    env:
      EXTERACONTEXT_AUTO_SYNC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python offline regressions (temporary fixtures only)
        run: |
          python tests/test_ci_offline.py --suite
          python tests/test_skill_contract.py
          python benchmark/agent-v1/validate.py
      - name: MCP syntax and corpus-independent contract
        working-directory: mcp
        run: |
          npm run check
          node --test test/mcp-contract.test.mjs
