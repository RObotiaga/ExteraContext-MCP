name: Bootstrap repository contents

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack source tree
        run: |
          cat bootstrap/part-* | base64 -d > bootstrap/source.tar.xz
          tar -xJf bootstrap/source.tar.xz --strip-components=1
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit unpacked repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: import initial source tree"
          git push
