name: Knowledge maintenance (manual preflight only)

# No schedule, external fetch, corpus build, pin advance, or automatic publish.
# A separate, explicitly approved change is required before enabling any of those.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter I_AUTHORIZE_KNOWLEDGE_PREFLIGHT to run offline fixture checks; this does NOT collect or publish knowledge."
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-preflight:
    if: ${{ inputs.confirmation == 'I_AUTHORIZE_KNOWLEDGE_PREFLIGHT' }}
    runs-on: ubuntu-latest
    env:
      EXTERACONTEXT_AUTO_SYNC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test isolated offline fixtures
        run: python tests/test_ci_offline.py
